services:
  redis:
    image: redis:7-alpine
    hostname: redis-local
    container_name: redis-local
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ~/projects/BlueSkyCloudServers/devops/development-environment/data/redis:/data   # local folder on your machine
