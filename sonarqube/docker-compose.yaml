services:
  sonarqube:
    image: sonarqube:latest
    hostname: sonarqube-local
    container_name: sonarqube-local
    depends_on:
      - sonarqube-postgres
    restart: unless-stopped
    ports:
      - "9000:9000"          # change left side if you want a different host port
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-postgres:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: sonarqube
      # Optional: tune Java opts if needed
      # SONAR_WEB_JVM_OPTS: "-Xmx1G -Xms1G"
    volumes:
      - ./sonarqube-data:/opt/sonarqube/data
      - ./sonarqube-logs:/opt/sonarqube/logs
      - ./sonarqube-conf:/opt/sonarqube/conf
      - ./sonarqube-extensions:/opt/sonarqube/extensions

  sonarqube-postgres:
    image: postgres:16-alpine
    container_name: sonarqube-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD: sonarqube
    volumes:
      - ./sonarqube-postgres:/var/lib/postgresql/data
